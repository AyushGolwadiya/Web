<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite App</title>
</head>

<body class="bg-black font-['Satoshi'] font-light">
  <div class="main w-full">
    <nav class="w-full fixed z-[10] top-0 left-0 py-2 px-10 flex justify-between items-center">
      <img class="w-[160px] mix-blend-screen filter saturate-150 contrast-200" src="https://preview.redd.it/3d-rendered-the-cyberpunk-logo-using-blender-v0-khopj82wqee91.png?width=1920&format=png&auto=webp&s=f42dbd8f5c04aedb9ba9291c1ba4d679029cc1f3" alt="">
      <div class="flex gap-15 text-white font-regular">
          <a class="hover:text-blue-500 hover:text-shadow-[0_5px_10px_#60A5FA] transition-colors tracking-tight " href="#">Games</a>
          <a class="hover:text-blue-500 hover:text-shadow-[0_5px_10px_#60A5FA] transition-colors tracking-tight" href="#">News</a>
          <a class="hover:text-blue-500 hover:text-shadow-[0_5px_10px_#60A5FA] transition-colors tracking-tight" href="#">Support</a>
          <a class="hover:text-blue-500 hover:text-shadow-[0_5px_10px_#60A5FA] transition-colors tracking-tight" href="#">Community</a>
          <a class="hover:text-blue-500 hover:text-shadow-[0_5px_10px_#60A5FA] transition-colors tracking-tight" href="#">Shop</a>
      </div>
    </nav>
    <div class="w-full h-screen overflow-hidden relative">
      <img
        class="w-1/2 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 mix-blend-lighten filter saturate-150 contrast-150"
        draggable="false"
        src="https://preview.redd.it/3d-rendered-the-cyberpunk-logo-using-blender-v0-khopj82wqee91.png?width=1920&format=png&auto=webp&s=f42dbd8f5c04aedb9ba9291c1ba4d679029cc1f3"
        alt="">
      <div class="w-70 h-70 rounded-full absolute z-[-1] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-yellow-100 blur-[100px]"></div> 
      <div class="absolute top-[55%] right-0 px-10">
        <h1 class="text-6xl text-yellow-300 text-shadow-[0_1px_1px_#60a5fa] w-90 font-bold uppercase">Get the ultimate experience of Cyber punk 2077</h1>
      </div>
      <canvas id="canvas"></canvas>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
